[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-rag"
version = "0.1.0"
description = "Multi-Agent personalized travel planner with local RAG and realtime research."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "crewai==1.15.5",
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.0",
  "jinja2==3.1.6",
  "python-multipart==0.0.22",
  "pydantic-settings==2.10.1",
  "langchain==1.3.2",
  "langchain-chroma==1.0.0",
  "langchain-huggingface==1.0.1",
  "chromadb==1.1.1",
  "tavily-python==0.7.12",
  "sentence-transformers==5.1.1",
  "httpx==0.28.1",
  "socksio==1.0.0",
  "SQLAlchemy==2.0.51",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
  "pytest-cov==6.3.0",
  "ruff==0.12.12",
]

[project.scripts]
travel-rag = "travel_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
travel_rag = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
